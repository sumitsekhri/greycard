# Builds the menu-bar app on GitHub's macOS machines, so your Mac needs no developer tools.
# Every push to main publishes a release with Greycard.dmg as a plain download:
# https://github.com/sumitsekhri/greycard/releases/latest
name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Verify DMG contents
        run: |
          ls -la build/
          MNT=$(hdiutil attach -nobrowse -readonly build/Greycard.dmg | grep -o '/Volumes/.*' | tail -1)
          echo "Mounted at: $MNT"
          ls -la "$MNT"
          test -x "$MNT/Greycard.app/Contents/MacOS/Greycard"
          codesign --verify --verbose=2 "$MNT/Greycard.app"
          hdiutil detach "$MNT"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Greycard-dmg
          path: build/Greycard.dmg

      - name: Publish release (plain DMG download)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Greycard ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/Greycard.dmg
          body: |
            Download **Greycard.dmg** below, open it and drag Greycard onto Applications.
            First launch: macOS will block it once. Click Done, then go to System Settings › Privacy & Security and click **Open Anyway**.
