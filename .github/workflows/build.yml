# Builds the menu-bar app on GitHub's macOS machines, so your Mac needs no developer tools.
# Every push: the DMG is attached to the run (Actions tab → run → Artifacts; arrives zipped).
# Tag a commit (e.g. v1.0.1): the DMG is published as a plain download on the Releases page.
name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Verify DMG contents
        run: |
          ls -la build/
          MNT=$(hdiutil attach -nobrowse -readonly build/Greycard.dmg | grep -o '/Volumes/.*' | tail -1)
          echo "Mounted at: $MNT"
          ls -la "$MNT"
          test -x "$MNT/Greycard.app/Contents/MacOS/Greycard"
          codesign --verify --verbose=2 "$MNT/Greycard.app"
          hdiutil detach "$MNT"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Greycard-dmg
          path: build/Greycard.dmg

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Greycard.dmg
          name: Greycard ${{ github.ref_name }}
          body: |
            Download **Greycard.dmg** below, open it and drag Greycard onto Applications.
            First launch: macOS will block it once. Click Done, then go to System Settings › Privacy & Security and click **Open Anyway**.
