# Builds the menu-bar app on GitHub's macOS machines, so your Mac needs no developer tools.
# Push this folder to a GitHub repo → Actions tab → latest run → download "Greycard-dmg".
# Tag a commit (e.g. v1.0) to also attach the DMG to a GitHub Release.
name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Greycard-dmg
          path: build/Greycard.dmg

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Greycard.dmg
